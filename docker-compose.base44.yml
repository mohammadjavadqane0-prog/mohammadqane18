# Base44 development environment for the luxury furniture website.
# The whole app is a Vite + React SPA with no backend services:
# all data is bundled TypeScript, cart/wishlist persist in localStorage.
services:
  web:
    image: node:22-bookworm-slim
    working_dir: /workspace
    ports:
      - "3000:5173"
    volumes:
      - ${BASE44_PROJECT_ROOT:-.}:/workspace
      - mv_node_modules:/workspace/node_modules
    environment:
      # platform sets these; Vite appends them to its dev allowedHosts
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - BASE44_PUBLIC_HOST_SUFFIX
    command:
      - sh
      - -ec
      - |
        npm install --no-audit --no-fund --no-progress
        exec npm run dev
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s
    restart: on-failure

volumes:
  mv_node_modules:
